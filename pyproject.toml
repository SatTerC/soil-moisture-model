[build-system]
requires = ["uv_build>=0.8.10,<0.9.0"]
build-backend = "uv_build"

[project]
name = "soil_moisture_model"
version = "0.2.0"
description = "A reduced-complexity weekly bucket model of soil moisture, driven by temperature, precipitation and plant biomass."
readme = "README.md"
authors = [
    { name = "vmyrgiotis", email = "vasmyr@ceh.ac.uk" },
    { name = "jmarshrossney", email = "17361029+jmarshrossney@users.noreply.github.com" },
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.2",
]

[dependency-groups]
dev = [
    {include-group = "test"},
    {include-group = "docs"},
    "pre-commit>=4.6.0",
    "pyright>=1.1.409",
    "ruff>=0.15.4",
    "rust-just>=1.46.0",
]
docs = [
    "mkdocstrings-python>=2.0.3",
    "zensical>=0.0.24",
]
test = [
    "hypothesis>=6.0",
    "pytest>=9.0.2",
    "pytest-cov>=6.0",
    # Smoke test of scripts/calibrate_icos.py; keep in step with its inline metadata
    "netcdf4>=1.7",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "scipy>=1.14",
    "xarray>=2025.1",
]

[tool.uv]
# Only resolve releases at least a week old. Set here, not only in the user's
# uv.toml, so CI resolves with the same option the lockfile records.
exclude-newer = "1 week"

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "D",   # pydocstyle
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
    "PT",  # flake8-pytest-style
    "I",   # isort
]

[tool.ruff.lint.per-file-ignores]
# Except tests and scripts from docstring requirements
"tests/**" = ["D", "E501"]
"scripts/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src/", "tests/"]

[tool.pytest.ini_options]
filterwarnings = [
    # Raised by netCDF4/xarray (test group only) under numpy >= 2.5
    "ignore:numpy.ndarray size changed:RuntimeWarning",
    "ignore:Setting the shape on a NumPy array:DeprecationWarning",
]
