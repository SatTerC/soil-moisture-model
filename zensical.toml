[project]
site_name = "Soil Moisture Model"
site_description = "A reduced-complexity weekly bucket model of soil moisture"
site_author = "vmyrgiotis, jmarshrossney"

site_url = "https://SatTerC.github.io/soil-moisture-model"
repo_name = "SatTerC/soil-moisture-model"
repo_url = "https://github.com/SatTerC/soil-moisture-model"
copyright = "Copyright &copy; 2026 vmyrgiotis, jmarshrossney"

use_directory_urls = false

nav = [
    { "Home" = "index.md" },
    { "Science" = "science.md" },
    { "Notation" = "notation.md" },
    { "API Reference" = [
        "API_Reference/model.md",
        "API_Reference/params.md",
        "API_Reference/processes.md",
    ] },
]

# Katex
extra_javascript = [
    "_static/js/katex.js",
    "https://unpkg.com/katex@0.16.22/dist/katex.min.js",
    "https://unpkg.com/katex@0.16.22/dist/contrib/auto-render.min.js"
]
extra_css = [
    "https://unpkg.com/katex@0.16.22/dist/katex.min.css"
]

[project.theme]
language = "en"
custom_dir = "overrides"
features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"


# Extensions
# ----------
# see https://zensical.org/docs/setup/extensions/python-markdown-extensions/

[project.markdown_extensions.admonition]

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.tilde]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]

[project.markdown_extensions.pymdownx.snippets]
base_path = ["docs"]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

# Mkdocstrings
# ------------

[project.plugins.mkdocstrings]
custom_templates = "docs_tools/templates"

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
annotations_path = "brief"
docstring_style = "numpy"
docstring_section_style = "list"
members_order = "source"
inherited_members = true
line_length = 88
merge_init_into_class = true
separate_signature = true
show_signature = true
signature_crossrefs = true
show_signature_annotations = true
show_if_no_docstring = false
show_root_full_path = true
show_root_heading = true
show_root_members_full_path = false
show_source = false
show_symbol_type_heading = true
show_symbol_type_toc = true

